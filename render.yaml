services:
  - type: web
    name: grocery-nutrition-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ARIZE_ENV
        value: prod
      - key: ARIZE_SPACE_ID_DEV
        sync: false
      - key: ARIZE_API_KEY_DEV
        sync: false
      - key: ARIZE_SPACE_ID_PROD
        sync: false
      - key: ARIZE_API_KEY_PROD
        sync: false
